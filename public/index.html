const $=s=>document.querySelector(s),mc=i=>M.find(m=>m.id==i);
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let fav=[];try{fav=JSON.parse(localStorage.getItem("cm_fav")||"[]")}catch(e){}
let cmp=[],Q=null;
const sv=()=>{try{localStorage.setItem("cm_fav",JSON.stringify(fav))}catch(e){}};
function toast(x){const t=$("#t");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function tf(i){fav=fav.includes(i)?fav.filter(x=>x!=i):[...fav,i];sv();toast(fav.includes(i)?"Guardado en favoritos":"Quitado de favoritos");route()}
function tc(i,el){if(cmp.includes(i))cmp=cmp.filter(x=>x!=i);else if(cmp.length>=3){el.checked=false;toast("Puedes comparar hasta 3 modelos");return}else cmp.push(i);toast("Para comparar: "+cmp.length+" seleccionado(s)")}
const card=m=>`<div class="card" style="--c:${C[m.c].k}"><b>${m.s}</b> <small>${m.t}</small><p>${m.n}</p><a href="#/m/${m.id}">Ver ficha</a> <button onclick="tf('${m.id}')" aria-label="Favorito">${fav.includes(m.id)?"★":"☆"}</button><label><input type="checkbox" ${cmp.includes(m.id)?"checked":""} onchange="tc('${m.id}',this)"> Comparar</label></div>`;
function results(){const q=nz($("#q")?.value||""),ct=$("#fc")?.value||"",ty=$("#ft")?.value||"";
const r=M.filter(m=>(!ct||m.c==ct)&&(!ty||m.t==ty)&&(!q||nz([m.n,m.s,m.t,m.def,m.use,m.k].join(" ")).includes(q)));
$("#r").innerHTML=r.length?`<div class="g">${r.map(card).join("")}</div>`:`<div class="sec">Sin resultados. Prueba con una sigla (STRIDE), un concepto o un problema como “gestión de riesgos”.</div>`}
function searchBox(){return`<div class="s"><input id="q" type="search" placeholder="¿Qué modelo de ciberseguridad quieres conocer?" aria-label="Buscar" oninput="results()"><select id="fc" onchange="results()" aria-label="Categoría"><option value="">Todas las categorías</option>${Object.entries(C).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")}</select><select id="ft" onchange="results()" aria-label="Tipo"><option value="">Todos los tipos</option>${[...new Set(M.map(m=>m.t))].map(t=>`<option>${t}</option>`).join("")}</select></div><div id="r"></div>`}
function diagram(m){const k=C[m.c].k;return`<div class="dg ${m.dg=="L"?"L":""}" style="--c:${k}">${m.comps.map((c,i)=>`<button onclick="dg(this,${JSON.stringify(c[1]).replace(/"/g,"&quot;")})">${c[0]}</button>`).join("")}</div><div class="dd" id="dd">Selecciona una pieza del diagrama para ver su detalle.</div>`}
function dg(b,t){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#dd").textContent=t}
/* Cuestionarios: m.q puede ser una pregunta [texto,opciones,correcta,explicación] o un arreglo de ellas. */
const QS=m=>!m.q?[]:Array.isArray(m.q[0])?m.q:[m.q];
function quiz(ids,back){const it=[];ids.forEach(i=>{const m=mc(i);if(m)QS(m).forEach(q=>it.push({m,q}))});Q={it,i:0,s:0,ans:false,back};qz()}
function qz(){if(!Q.it.length){$("#app").innerHTML=`<div class="sec">Este cuestionario aún no tiene preguntas. <button class="p" onclick="location.hash=Q.back;route()">Volver</button></div>`;return}
if(Q.i>=Q.it.length){$("#app").innerHTML=`<div class="sec"><h2>Cuestionario completado</h2><p>Puntuación final: ${Q.s} de ${Q.it.length}.</p><button class="p" onclick="quiz(Q.it.map(x=>x.m.id).filter((v,i,a)=>a.indexOf(v)==i),Q.back)">Repetir</button> <button class="p" onclick="location.hash=Q.back;route()">Volver</button></div>`;return}
const {m,q}=Q.it[Q.i];Q.ans=false;$("#app").innerHTML=`<div class="sec q"><p class="mu">${m.s} · pregunta ${Q.i+1} de ${Q.it.length}</p><h3>${q[0]}</h3>${q[1].map((o,i)=>`<label onclick="ans(${i},this)">${o}</label>`).join("")}<div id="fb"></div></div>`}
function ans(i,el){if(!Q||Q.ans)return;Q.ans=true;const q=Q.it[Q.i].q,ok=i==q[2],ls=document.querySelectorAll(".q label");if(ok)Q.s++;el.classList.add(ok?"ok":"no");ls[q[2]].classList.add("ok");ls.forEach(l=>l.style.pointerEvents="none");$("#fb").innerHTML=`<div class="note">${ok?"Correcto. ":"No es correcto. "}${q[3]}</div><button class="p" onclick="Q.i++;qz()">${Q.i+1<Q.it.length?"Siguiente":"Ver resultado"}</button>`}
function radial(){const L=[["Marcos de","gestión"],["Modelos de","defensa"],["Amenazas y","pruebas"],["Arquitectura","técnica"],["Desarrollo","seguro"]];let l="",n="";
Object.keys(C).forEach((k,j)=>{const a=(-90+72*j)*Math.PI/180,x=300+210*Math.cos(a),y=300+210*Math.sin(a),c=C[k].k,ty=j==0?y-68:y+66;
l+=`<line x1="300" y1="300" x2="${x}" y2="${y}" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`;
n+=`<a class="nd" href="#/cat/${k}"><title>${C[k].n}</title><circle cx="${x}" cy="${y}" r="44" fill="var(--sf)" stroke="${c}" stroke-width="4"/><text x="${x}" y="${y+12}" style="font-size:34px">${C[k].i}</text><text x="${x}" y="${ty}">${L[j][0]}</text><text x="${x}" y="${ty+22}">${L[j][1]}</text></a>`});
return`<svg class="rd" viewBox="0 0 600 600" role="img" aria-label="Mapa de las cinco categorías">${l}<circle cx="300" cy="300" r="68" fill="var(--ac)"/><text x="300" y="296" style="font-size:32px">🛡️</text><text x="300" y="328" style="fill:var(--bg);font-size:18px">CyberModelos</text>${n}</svg>`}
/* Asistente de IA: la petición va a la función serverless /api/chat (misma URL del sitio). El contexto vive en el servidor. */
const AI_ENDPOINT="/api/chat";
function aiBox(){return`<div class="sec ai"><b>Asistente de ciberseguridad</b> <span class="tag">IA</span><div class="s"><input id="ai" placeholder="¿Qué quieres aprender sobre ciberseguridad?" aria-label="Pregunta" onkeydown="if(event.key=='Enter')askAI()"><button class="p" onclick="askAI()">Enviar</button></div><div id="aio" class="mu"></div></div>`}
async function askAI(){const q=$("#ai").value.trim(),o=$("#aio");if(!q){o.textContent="Escribe una pregunta primero.";return}
if(q.length>500){o.textContent="La pregunta puede tener hasta 500 caracteres.";return}
o.textContent="Consultando al asistente…";
try{const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pregunta:q})});const d=await r.json();o.textContent=d.respuesta||"No se recibió respuesta del asistente."}catch(e){o.textContent="No se pudo contactar al asistente."}}
function sec(t,b){return`<div class="sec"><h3>${t}</h3>${b}</div>`}
const ul=a=>"<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>";
function detail(m){const k=C[m.c].k;return`<p><a href="#/cat/${m.c}">← ${C[m.c].n}</a></p><h1>${m.n}</h1><span class="tag" style="--c:${k}">${m.t}</span>${m.v?`<span class="tag">${m.v}</span>`:""}<p><button onclick="tf('${m.id}')">${fav.includes(m.id)?"★ En favoritos":"☆ Guardar"}</button> <button onclick="cmp.includes('${m.id}')||cmp.length>=3?toast('Ya está o hay 3 modelos'):cmp.push('${m.id}');location.hash='#/cmp'">Comparar</button> <button class="p" onclick="quiz(['${m.id}'],'#/m/${m.id}')">Cuestionario</button></p>`+
sec("Definición",`<p>${m.def}</p>${m.extra?`<div class="note">${m.extra}</div>`:""}`)+sec("¿Para qué sirve?",`<p>${m.use}</p>`)+sec("¿Cómo funciona?","<ol>"+m.how.map(x=>`<li>${x}</li>`).join("")+"</ol>")+sec("Componentes (diagrama interactivo)",diagram(m))+sec("Ejemplo práctico (ficticio)",`<p>${m.ex}</p>`)+sec("Implementación",`<p>${m.impl}</p>`)+sec("Evidencias de cumplimiento o aplicación",ul(m.evid||["Sin dato verificado."]))+sec("Entregables por fase",ul(m.ent||["Sin dato verificado."]))+`<div class="g"><div class="sec"><h3>Ventajas</h3>${ul(m.pro)}</div><div class="sec"><h3>Limitaciones</h3>${ul(m.con)}</div></div>`+sec("Casos de uso",`<p>${m.uses}</p>`)+sec("Relación con otros modelos",m.rel.map(r=>`<a class="tag" href="#/m/${r}">${mc(r).s}</a>`).join(""))+sec("Fuentes",ul(m.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`)))}
function cmpView(){if(cmp.length<2)return`<h1>Comparar modelos</h1><div class="sec">Selecciona 2 o 3 modelos con la casilla “Comparar” en cualquier tarjeta. Ahora hay ${cmp.length}.</div>${searchBox()}`;
const ms=cmp.map(mc),row=(l,f)=>`<tr><th>${l}</th>${ms.map(m=>`<td>${f(m)}</td>`).join("")}</tr>`;
return`<h1>Comparar modelos</h1><button onclick="cmp=[];route()">Limpiar</button><div class="w"><table><tr><th></th>${ms.map(m=>`<th>${m.s}</th>`).join("")}</tr>${row("Tipo",m=>m.t)}${row("Objetivo",m=>m.use)}${row("Funcionamiento",m=>m.how.join(" → "))}${row("Alcance",m=>C[m.c].n)}${row("Ventajas",m=>m.pro.join("; "))}${row("Limitaciones",m=>m.con.join("; "))}${row("Casos de uso",m=>m.uses)}</table></div><div class="note">Recuerda: STRIDE identifica amenazas, DREAD las valora y PTES guía una evaluación. No son equivalentes.</div>`}
function route(){const h=location.hash.slice(2).split("/"),a=$("#app");Q=null;
if(h[0]=="m"&&mc(h[1])){a.innerHTML=detail(mc(h[1]))}
else if(h[0]=="cat"&&C[h[1]]){const c=C[h[1]],ms=M.filter(m=>m.c==h[1]);a.innerHTML=`<h1>${c.i} ${c.n}</h1><p>${c.d}</p><button class="p" onclick="quiz(${JSON.stringify(ms.map(m=>m.id)).replace(/"/g,"'")},'#/cat/${h[1]}')">Cuestionario de la categoría</button><div class="g">${ms.map(card).join("")}</div>`}
else if(h[0]=="all"){a.innerHTML=`<h1>Catálogo</h1>${searchBox()}`;results()}
else if(h[0]=="cmp"){a.innerHTML=cmpView();if($("#r"))results()}
else if(h[0]=="gl"){a.innerHTML=`<h1>Glosario</h1>`+G.map(g=>`<div class="sec"><b>${g[0]}</b><br>${g[1]}</div>`).join("")}
else if(h[0]=="fav"){const f=M.filter(m=>fav.includes(m.id));a.innerHTML=`<h1>Favoritos</h1>`+(f.length?`<div class="g">${f.map(card).join("")}</div>`:`<div class="sec">Aún no tienes favoritos. Pulsa ☆ en cualquier modelo para guardarlo.</div>`)}
else if(h[0]=="src"){a.innerHTML=`<h1>Fuentes</h1><div class="note">Revisa siempre la versión vigente en la fuente oficial.</div>`+M.map(m=>sec(m.s,ul(m.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`)))).join("")}
else{a.innerHTML=`<h1>Explora los modelos de ciberseguridad</h1><p class="mu">Aprende qué es cada marco, estándar o metodología, cómo funciona y cuándo usarlo. Contenido educativo; verifica las versiones en las fuentes oficiales.</p>${aiBox()}${searchBox()}<h2>Explora por categoría</h2>${radial()}`;results()}
window.scrollTo(0,0)}
$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme=="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
addEventListener("hashchange",route);route();
</script></body></html>
